[codecrate]
output = "context_schreibatlas.md"
keep_docstrings = true
dedupe = true
metadata = false
respect_gitignore = true
exclude = ["*/.venv/*", "context_schreibatlas.*"]
gitignore_allow = ["pykokoro/_version.py"]
include = [
  "**/*.py",
  "**/*.toml",
  "**/*.md",
  "**/*.json",
  "**/*.txt",
  "**/*.csv",
  "**/*.tsv",
  "**/*.yaml",
  "**/*.yml",
  "**/*.ssmd",
  "**/*.js",
  "**/*.html",
  "**/*.ts",
  "**/*.mts",
  "**/*.tsx",
  "**/*.css",
  "**/*.astro",
  "**/*.svg",
  "**/*.mjs",
  "**/*.cjs",
  "LICENSE",
]
split_max_chars = 0
layout = "full"
profile = "portable-agent"
emit_standalone_unpacker = true
