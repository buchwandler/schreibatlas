  en: "Historical Deutsche Normalschrift model documented in the CTAN manual. The character list reflects the documented package font inventory and is not a complete or authoritative teaching repertoire. The local browser TTF is a derived digital reference, not an official source trace or evidence of stroke order or writing movement."
