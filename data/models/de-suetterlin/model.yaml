  connections: {de: "Das Handbuch beschreibt das runde s am Wortende und dessen automatische Setzung über Ligaturtabellen. Das belegt keine individuelle Strichfolge.", en: "The manual documents round s at word endings and its automatic selection by ligature tables. This does not establish individual stroke order."}
