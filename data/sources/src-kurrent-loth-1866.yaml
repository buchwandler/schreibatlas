notes: "Commons identifies this 2010 vector chart as a retouched derivative of the alphabet plate in Loth's 1866 Der Damen-Briefsteller. It shows A-Z, a-z, lower-case umlauts, long s, ß, and several ligatures; uppercase umlauts are represented as Ae, Oe, and Ue. This record is citation-only and does not claim a redistribution license for the derivative chart."
