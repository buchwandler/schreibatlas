# SPDX-License-Identifier: CC-BY-SA-4.0
name: Accessibility issue
description: Report a keyboard, screen-reader, contrast, or responsive-accessibility issue.
title: "[Accessibility] "
body:
  - type: markdown
    attributes:
      value: Do not attach user handwriting, photographs, or private reports.
  - type: input
    id: route
    attributes:
      label: Page route
      placeholder: /de/analyze/
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and assistive technology
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
